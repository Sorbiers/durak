# The table server behind nginx. deploy.sh puts the port in and installs this as
# /opt/podkidnoy/network-nginx.conf, which the podkidnoy.online server block includes.
#
# Not logged: a page's key is in the address of its event stream, and the stream reconnects often.
location /network/api/ {
    access_log off;
    limit_req zone=podkidnoynet burst=40 nodelay;
    client_max_body_size 200k;        # a guest's picture is the only large thing sent
    proxy_pass http://127.0.0.1:@PORT@;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;              # the event stream must not be held back
    proxy_read_timeout 1h;
    error_page 502 504 = @network_off;
}

# The service is stopped (network.bat stop): a plain answer the game understands.
location @network_off {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 '{"error":"off"}';
}
