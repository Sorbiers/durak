# synarteum.com - the Durak trainer, a static site in /opt/durak/web.
#
# This is the bootstrap copy (plain HTTP). deploy.sh installs it only while the live copy in
# /etc/nginx/conf.d has no TLS yet; once certbot has edited the live copy, it is left alone.
server {
    listen 80;
    listen [::]:80;
    server_name synarteum.com www.synarteum.com;

    root /opt/durak/web;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Everything is served from this origin. Inline styles position the cards; data: covers
    # the icon and the cloth texture.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # 'expires' is used for caching because an add_header inside a location would drop the
    # security headers above.
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location /assets/ { expires 1y; }      # file names carry a content hash
    location /cards/  { expires 7d; }
    location /        { expires -1; try_files $uri $uri/ =404; }
    location ~ /\.    { deny all; }
}
