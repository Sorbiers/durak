# podkidnoy.online - the Durak card game, served at the site root from /opt/podkidnoy/web.
#
# This is only the bootstrap nginx site: deploy.sh installs it just while the live copy has
# no TLS, so certbot's edits (the :443 server + the 80->443 redirect) are never overwritten.
# For HTTPS, once DNS points at the server:
#   sudo certbot --nginx -d podkidnoy.online -d www.podkidnoy.online
server {
    listen 80;
    listen [::]:80;
    server_name podkidnoy.online;
    access_log /var/log/nginx/podkidnoy.access.log;

    root /opt/podkidnoy/web;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Everything is served from this origin. Inline styles position the cards; data: covers
    # the icon and the cloth texture.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location /assets/ { expires 1y; }   # file names carry a content hash
    location /cards/  { expires 7d; }
    location /        { expires -1; try_files $uri $uri/ =404; }
    location ~ /\.    { deny all; }
}

# www is the same site under another name: send it to the main address. $scheme keeps it
# working both before and after the certificate is installed.
server {
    listen 80;
    listen [::]:80;
    server_name www.podkidnoy.online;
    access_log /var/log/nginx/podkidnoy.access.log;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 $scheme://podkidnoy.online$request_uri; }
}
