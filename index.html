<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Дурак</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%231d4a39'/%3E%3Cpath transform='translate(15 15) scale(.7)' fill='%23f2d594' d='M50 6C80 32 92 46 92 60c0 13-10 20-20 20-8 0-14-4-18-10 1 10 4 18 10 24H36c6-6 9-14 10-24-4 6-10 10-18 10C18 80 8 73 8 60 8 46 20 32 50 6Z'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header id="bar">
      <div id="brand" class="brand">Дурак</div>
      <div class="meta" id="meta"></div>
      <div class="score" id="score"></div>
      <nav>
        <button id="btn-new" class="ghost"></button>
        <button id="btn-settings" class="ghost"></button>
        <button id="btn-lang" class="ghost"></button>
      </nav>
    </header>

    <main id="stage">
      <svg id="aim" aria-hidden="true">
        <defs>
          <marker id="aim-head" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto">
            <path d="M0 0 L10 5 L0 10 Z" />
          </marker>
        </defs>
        <path id="aim-path" marker-end="url(#aim-head)" />
      </svg>
      <div id="trump-mark"></div>
      <div id="deck-count" class="pile-label"></div>
      <button id="discard-label" class="pile-label"></button>
      <div id="seats"></div>
      <div id="cards"></div>
      <div id="actions">
        <div id="status"></div>
        <div id="buttons"></div>
      </div>
      <button id="resign" class="plain" hidden></button>
      <div id="result" hidden></div>
    </main>

    <dialog id="settings"></dialog>
    <dialog id="discard-view"></dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
